---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test and build
        run: ./gradlew --no-daemon clean test jar
      - name: Verify tag, NQEs, and release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          test -n "${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          artifact_name="forward-neo4j-plugin-${version}.jar"
          artifact="build/libs/${artifact_name}"
          test -f "${artifact}"
          jar tf "${artifact}" | grep -Fx nqe/interfaces-v1.nqe
          jar tf "${artifact}" | grep -Fx nqe/interface-addresses-v1.nqe
          jar tf "${artifact}" | grep -Fx nqe/network-instances-v1.nqe
          jar tf "${artifact}" | grep -Fx nqe/bgp-neighbors-v1.nqe
          (
            cd build/libs
            sha256sum "${artifact_name}" > "${artifact_name}.sha256"
          )
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARTIFACT}" "${ARTIFACT}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${ARTIFACT}" "${ARTIFACT}.sha256" \
              --verify-tag \
              --title "Forward Neo4j ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
