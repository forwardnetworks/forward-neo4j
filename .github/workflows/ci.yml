---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
      - name: Test, build, and generate SBOM
        run: >-
          ./gradlew --no-daemon --max-workers=1 clean :test jar cyclonedxDirectBom
          :connector:test :connector:distTar :connector:distZip :connector:cyclonedxDirectBom
      - name: Verify release inputs and deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          test -n "${version}"
          artifact="build/libs/forward-neo4j-plugin-${version}.jar"
          sbom="build/reports/cyclonedx-direct/bom.json"
          connector_tar="connector/build/distributions/forward-neo4j-connector-${version}.tar"
          connector_zip="connector/build/distributions/forward-neo4j-connector-${version}.zip"
          connector_sbom="connector/build/reports/cyclonedx-direct/bom.json"
          test -f "${artifact}"
          test -s "${sbom}"
          test -s "${connector_tar}"
          test -s "${connector_zip}"
          test -s "${connector_sbom}"
          tar_listing="$(tar -tf "${connector_tar}")"
          zip_listing="$(unzip -Z1 "${connector_zip}")"
          jar_listing="$(jar tf "${artifact}")"
          grep -Eq '/bin/forward-neo4j-connector$' <<<"${tar_listing}"
          grep -Eq '/bin/forward-neo4j-connector$' <<<"${zip_listing}"
          grep -Fxq nqe/interfaces-v1.nqe <<<"${jar_listing}"
          grep -Fxq nqe/interface-addresses-v1.nqe <<<"${jar_listing}"
          grep -Fxq nqe/network-instances-v1.nqe <<<"${jar_listing}"
          grep -Fxq nqe/bgp-neighbors-v1.nqe <<<"${jar_listing}"
          bash -n demo/run-import.sh deploy/install-neo4j-browser.sh \
            deploy/install-plugin.sh deploy/verify-install.sh \
            deploy/export-metrics.sh deploy/run-scheduled-import.sh
          fixture="$(mktemp -d)"
          deploy/install-plugin.sh "${artifact}" "${fixture}/neo4j"
          cp "${artifact}" "${fixture}/neo4j/plugins/forward-neo4j-plugin.previous.jar"
          deploy/install-plugin.sh "${artifact}" "${fixture}/neo4j"
          cmp "${artifact}" "${fixture}/neo4j/plugins/forward-neo4j-plugin.jar"
          cmp "${artifact}" "${fixture}/neo4j/plugins/forward-neo4j-plugin.jar.previous"
          test -f "${fixture}/neo4j/plugins/forward-neo4j-plugin.previous.jar.disabled"
          test ! -e "${fixture}/neo4j/plugins/forward-neo4j-plugin.previous.jar"
          active_plugins="$(find "${fixture}/neo4j/plugins" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          test "${active_plugins}" -eq 1
          cp "${sbom}" "build/libs/forward-neo4j-plugin-${version}.cdx.json"
          cp "${connector_sbom}" "connector/build/distributions/forward-neo4j-connector-${version}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: forward-neo4j-plugin
          path: |
            build/libs/forward-neo4j-plugin-*.jar
            build/libs/forward-neo4j-plugin-*.cdx.json
            connector/build/distributions/forward-neo4j-connector-*.tar
            connector/build/distributions/forward-neo4j-connector-*.zip
            connector/build/distributions/forward-neo4j-connector-*.cdx.json
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Validate Compose and build the image
        shell: bash
        env:
          NEO4J_PASSWORD: forward-ci-only-password
        run: |
          set -euo pipefail
          docker compose -f demo/compose.yaml config >/dev/null
          docker build --tag forward-neo4j:ci --file demo/Dockerfile .
      - name: Start Neo4j and verify the installed plugin
        shell: bash
        run: |
          set -euo pipefail
          container_name="forward-neo4j-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "${container_name}" || true
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "${container_name}" \
            --env NEO4J_AUTH=neo4j/forward-ci-only-password \
            --env 'NEO4J_dbms_security_procedures_allowlist=forward.*' \
            forward-neo4j:ci >/dev/null
          ready=false
          for _ in $(seq 1 90); do
            if docker exec "${container_name}" cypher-shell \
              --address bolt://127.0.0.1:7687 \
              --username neo4j \
              --password forward-ci-only-password \
              'RETURN 1 AS ready' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "${ready}" = true
          expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          docker exec "${container_name}" cypher-shell \
            --address bolt://127.0.0.1:7687 \
            --username neo4j \
            --password forward-ci-only-password \
            "CALL forward.plugin.info() YIELD version RETURN version = '${expected_version}' AS versionMatches" \
            | grep -Fx TRUE
