name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test and build
        run: ./gradlew --no-daemon clean test jar
      - name: Verify bundled NQE resources
        run: |
          jar tf build/libs/forward-neo4j-plugin-0.2.0.jar | grep -Fx nqe/interfaces-v1.nqe
          jar tf build/libs/forward-neo4j-plugin-0.2.0.jar | grep -Fx nqe/interface-addresses-v1.nqe
          jar tf build/libs/forward-neo4j-plugin-0.2.0.jar | grep -Fx nqe/network-instances-v1.nqe
          jar tf build/libs/forward-neo4j-plugin-0.2.0.jar | grep -Fx nqe/bgp-neighbors-v1.nqe
      - uses: actions/upload-artifact@v4
        with:
          name: forward-neo4j-plugin-0.2.0
          path: build/libs/forward-neo4j-plugin-0.2.0.jar
