---
name: forward-neo4j-demo

services:
  neo4j:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD to a unique local demo password}
      NEO4J_dbms_security_procedures_allowlist: forward.*
      FORWARD_URL: ${FORWARD_URL:-}
      FORWARD_TOKEN: ${FORWARD_TOKEN:-}
      FORWARD_USERNAME: ${FORWARD_USERNAME:-}
      FORWARD_PASSWORD: ${FORWARD_PASSWORD:-}
      FORWARD_DEFAULT_NETWORK_ID: ${FORWARD_DEFAULT_NETWORK_ID:-}
      FORWARD_LICENSE_TIER: ${FORWARD_LICENSE_TIER:-B}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
